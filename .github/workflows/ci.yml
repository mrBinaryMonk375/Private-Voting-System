name: CI — Private Voting System

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '22'

jobs:
  # ─── Install & Compile ─────────────────────────────────────────────────────
  compile:
    name: Compile Compact Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          compact update

      - name: Install root dependencies
        run: npm install

      - name: Install contract dependencies
        run: cd contract && npm install

      - name: Compile Compact contract
        run: |
          cd contract
          compact compile src/voting.compact ./src/managed/voting

      - name: Verify generated artifacts exist
        run: |
          ls -la contract/src/managed/voting/
          echo "✅ Compact contract compiled successfully"

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-managed
          path: contract/src/managed/voting/

  # ─── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Run Contract Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          compact update

      - name: Install root dependencies
        run: npm install

      - name: Install contract dependencies
        run: cd contract && npm install

      - name: Compile contract (required for tests)
        run: cd contract && compact compile src/voting.compact ./src/managed/voting

      - name: Run contract tests
        run: cd contract && npm run test

  # ─── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          compact update

      - name: Install root dependencies
        run: npm install

      - name: Install contract dependencies
        run: cd contract && npm install

      - name: Install API dependencies
        run: cd api && npm install

      - name: Compile contract
        run: cd contract && compact compile src/voting.compact ./src/managed/voting

      - name: Build contract
        run: cd contract && npm run build

      - name: Build API
        run: cd api && npm run build

      - name: Install voting-cli dependencies
        run: cd voting-cli && npm install

      - name: Build voting-cli
        run: cd voting-cli && npm run build

      - name: Install voting-ui dependencies
        run: cd voting-ui && npm install

      - name: Typecheck voting-ui
        run: cd voting-ui && npm run typecheck

      - name: Build voting-ui (preprod)
        env:
          VITE_NETWORK_ID: preprod
          VITE_LOGGING_LEVEL: info
          VITE_CONTRACT_ADDRESS: "<YOUR_DEPLOYED_CONTRACT_ADDRESS>"
        run: cd voting-ui && npm run build
        continue-on-error: true  # May fail if managed/ keys not present until contract deployed

      - name: ✅ Build complete
        run: echo "All packages built successfully!"
